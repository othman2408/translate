<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="Translate large promotional tile">
  <defs>
    <linearGradient id="bg" x1="94" x2="1294" y1="22" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FCFF" offset="0"/>
      <stop stop-color="#EEF7FF" offset=".46"/>
      <stop stop-color="#DCEEFF" offset="1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".84" offset="0"/>
      <stop stop-color="#F4FAFF" stop-opacity=".68" offset="1"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1477F8" flood-opacity=".18"/>
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0F172A" flood-opacity=".1"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <circle cx="1228" cy="78" r="236" fill="#FFFFFF" opacity=".58"/>
  <circle cx="104" cy="538" r="286" fill="#B9DEFF" opacity=".34"/>
  <circle cx="1086" cy="488" r="172" fill="#8DCCFF" opacity=".18"/>

  <path d="M1028 438c96-43 166-118 209-226" fill="none" stroke="#8DCCFF" stroke-linecap="round" stroke-width="4" opacity=".45"/>
  <path d="M1086 462c104-50 181-137 229-268" fill="none" stroke="#1477F8" stroke-linecap="round" stroke-width="4" opacity=".18"/>
  <path d="M940 89c69 19 127 54 174 104" fill="none" stroke="#1477F8" stroke-linecap="round" stroke-width="3" opacity=".16"/>

  <g transform="translate(116 126)">
    <image href="../icon/logo.svg" x="0" y="0" width="168" height="168" preserveAspectRatio="xMidYMid meet" filter="url(#softShadow)"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="340" y="203" fill="#0F172A" font-size="72" font-weight="780" letter-spacing="0">Translate</text>
    <text x="344" y="258" fill="#33516E" font-size="30" font-weight="600">Translate, rewrite, and explain selected text.</text>

    <g transform="translate(344 324)">
      <rect x="0" y="0" width="166" height="44" rx="22" fill="#FFFFFF" opacity=".76"/>
      <circle cx="28" cy="22" r="6" fill="#1477F8"/>
      <text x="48" y="30" fill="#294A68" font-size="20" font-weight="700">Translate</text>

      <rect x="190" y="0" width="151" height="44" rx="22" fill="#FFFFFF" opacity=".76"/>
      <circle cx="218" cy="22" r="6" fill="#1477F8"/>
      <text x="238" y="30" fill="#294A68" font-size="20" font-weight="700">Rewrite</text>

      <rect x="365" y="0" width="148" height="44" rx="22" fill="#FFFFFF" opacity=".76"/>
      <circle cx="393" cy="22" r="6" fill="#1477F8"/>
      <text x="413" y="30" fill="#294A68" font-size="20" font-weight="700">Explain</text>
    </g>
  </g>

  <g transform="translate(946 138)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="312" height="284" rx="28" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity=".82"/>
    <rect x="28" y="34" width="174" height="18" rx="9" fill="#1477F8" opacity=".24"/>
    <rect x="28" y="74" width="256" height="14" rx="7" fill="#33516E" opacity=".18"/>
    <rect x="28" y="104" width="228" height="14" rx="7" fill="#33516E" opacity=".15"/>
    <rect x="28" y="152" width="102" height="16" rx="8" fill="#1477F8" opacity=".3"/>
    <rect x="28" y="188" width="256" height="14" rx="7" fill="#33516E" opacity=".2"/>
    <rect x="28" y="218" width="214" height="14" rx="7" fill="#33516E" opacity=".16"/>
  </g>
</svg>
